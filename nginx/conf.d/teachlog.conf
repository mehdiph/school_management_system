upstream django {
    server web:8000;
}

# Catch-all: anything not addressed to our domain (bare IP, spoofed Host
# headers, scanners) is dropped without a response. On 443 the TLS handshake
# is refused outright, so no certificate is needed for this block.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

# Port 80: only Let's Encrypt challenges. Everything else goes to HTTPS.
# The challenge path must stay on plain HTTP or renewals fail.
server {
    listen 80;
    server_name nasle-ghalam-info.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nasle-ghalam-info.ir;

    ssl_certificate     /etc/letsencrypt/live/nasle-ghalam-info.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasle-ghalam-info.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        gzip_static on;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}