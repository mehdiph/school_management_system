upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Avatars and PDF attachments go through here; Django's default of 2.5MB
    # in memory is separate — this is Nginx's own ceiling on the request body.
    client_max_body_size 10M;

    # Nginx serves the collected static files directly from the shared volume,
    # so these never reach Django. WhiteNoise stays in the image as a fallback
    # for anything that bypasses Nginx (and for running the app without it).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";

        # WhiteNoise's collectstatic already wrote .gz/.br next to each file.
        gzip_static on;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}